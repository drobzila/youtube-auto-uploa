name: Delete Videos from Google Drive

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC = 06:00 بتوقيت الجزائر
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    name: Delete old videos from Google Drive

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib packaging

      - name: 🗑️ Run deletion script
        run: |
          echo "🚀 Starting deletion process..."
          python youtube.py
