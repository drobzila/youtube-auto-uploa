name: Delete Videos from Google Drive

on:
  workflow_dispatch:  # يشغله المستخدم يدويًا من واجهة GitHub

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Run the deletion script
        env:
          # لا نحتاج متغيرات سرية إذا استُخدم ملف client_secret.json محليًا
        run: python youtube.py
