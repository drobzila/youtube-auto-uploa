name: Daily YouTube Upload

on:
  schedule:
    - cron: '0 7 * * *'  # كل يوم الساعة 7 صباحًا بتوقيت UTC
  workflow_dispatch:      # إمكانية التشغيل اليدوي من GitHub

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r .github/requirements.txt

      - name: Restore credentials
        run: |
          echo "$CLIENT_SECRET" > client_secret.json
          echo "$TOKEN_PICKLE" | base64 -d > token_upload.pickle
          echo "$DRIVE_CREDS" > drive_creds.txt

      - name: Run upload script
        run: python upload.py

    env:
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      TOKEN_PICKLE: ${{ secrets.TOKEN_PICKLE }}
      DRIVE_CREDS: ${{ secrets.DRIVE_CREDS }}
