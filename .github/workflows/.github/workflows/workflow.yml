name: Daily YouTube Upload

on:
  schedule:
    - cron: '0 7 * * *'  # تشغيل يومي الساعة 7 صباحًا UTC
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Restore Drive service account credentials
        run: echo "${{ secrets.GOOGLE_CREDS }}" > client_secret_drive.json

      - name: Download videos from Drive
        run: python download.py

      - name: Restore YouTube OAuth client secret
        run: echo "${{ secrets.CLIENT_SECRET }}" > client_secret_youtube.json

      - name: Restore token.pickle for YouTube OAuth
        run: echo "${{ secrets.TOKEN_PICKLE }}" | base64 -d > token.pickle

      - name: Upload videos to YouTube
        run: python upload.py
