name: Download Files from Google Drive

on:
  workflow_dispatch:  # هذا يسمح بتشغيل السكربت يدويًا عبر GitHub Actions

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Run download script
      env:
        DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
        DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
        DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      run: python download_files.py
