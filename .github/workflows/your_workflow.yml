name: Upload Videos to YouTube

on:
  push:
    branches:
      - main

jobs:
  upload-video:
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: Check out your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # الخطوة 2: إعداد بيئة Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # الخطوة 3: تثبيت الحزم المطلوبة
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      # الخطوة 4: تحميل الـ Secrets إلى البيئة
      - name: Set up environment variables
        run: |
          echo "GOOGLE_DRIVE_CREDENTIALS_JSON=${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}" >> $GITHUB_ENV
          echo "CLIENT_SECRETS_JSON=${{ secrets.CLIENT_SECRETS_JSON }}" >> $GITHUB_ENV

      # الخطوة 5: تنفيذ السكربت
      - name: Run the upload script
        run: python upload_videos.py
