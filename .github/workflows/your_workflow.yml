name: YouTube Video Upload

# Trigger action on push to the main branch
on:
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest  # You can change this to windows-latest or macos-latest if needed
    
    steps:
    # Step 1: Checkout code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'  # Specify the Python version you want to use

    # Step 3: Install required dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Make sure all required libraries are in this file

    # Step 4: Run the video upload script
    - name: Run the video upload script
      run: python upload_videos.py
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
