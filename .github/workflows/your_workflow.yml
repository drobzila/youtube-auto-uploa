name: Upload Video to YouTube from Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload_video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out the code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install google-auth google-auth-oauthlib google-api-python-client google-auth-httplib2

    - name: Set up Google API credentials
      run: echo "${{ secrets.GOOGLE_API_CREDENTIALS }}" > credentials.json

    - name: Run the upload video script
      env:
        GOOGLE_APPLICATION_CREDENTIALS: credentials.json
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python script.py
