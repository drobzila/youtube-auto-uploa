name: Upload Video to YouTube

on:
  push:
    branches:
      - main
    paths:
      - '**/*.mp4'

jobs:
  upload_video:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      # إضافة بيانات JSON مباشرة إلى environment variables
      - name: Set Google Drive and YouTube credentials
        run: |
          echo "$GOOGLE_DRIVE_CREDENTIALS_JSON" > google_drive_credentials.json
          echo "$CLIENT_SECRETS_JSON" > client_secrets.json

      # تحميل السكربت وتشغيله
      - name: Upload video to YouTube
        run: |
          python upload_videos.py
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
