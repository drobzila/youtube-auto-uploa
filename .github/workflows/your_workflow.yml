name: Run Python Script Every Minute

on:
  schedule:
    - cron: '* * * * *'  # تشغيل السكربت كل دقيقة
  workflow_dispatch:  # يسمح بتشغيله يدويًا أيضًا

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2  # سحب الكود من المستودع

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'  # تأكد من أنك تستخدم Python 3

      - name: Run Python script
        run: |
          python script.py  # تنفيذ السكربت

      - name: Set up Git config
        run: |
          git config --global user.name "GitHub Actions"  # إعداد اسم المستخدم
          git config --global user.email "actions@github.com"  # إعداد البريد الإلكتروني

      - name: Commit and push log changes
        run: |
          git add log.txt  # إضافة ملف السجل إلى Git
          git commit -m "Update log with Hello, World!"  # إضافة التغيير (commit)
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git  # رفع التغييرات باستخدام التوكن
