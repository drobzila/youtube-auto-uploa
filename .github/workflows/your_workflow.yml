name: Run Python Script Every Minute

on:
  schedule:
    - cron: '* * * * *'  # يشغل السكربت كل دقيقة
  workflow_dispatch:  # يسمح بتشغيل السكربت يدويًا أيضًا

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Run script
        run: |
          python script.py  # تأكد من أن السكربت هو الاسم الصحيح
