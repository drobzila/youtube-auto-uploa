name: Upload Video to YouTube

on:
  schedule:
    - cron: '0 7 * * *'  # تشغيل السكربت يوميًا الساعة 7:00 AM بتوقيت UTC
  workflow_dispatch:  # يمكنك تشغيل السكربت يدويًا من GitHub Actions

jobs:
  upload_video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.8  # تأكد من تحديد النسخة المناسبة من Python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Authenticate with Google (YouTube API and Drive API)
      run: |
        python -c "
import os
from google.oauth2.credentials import Credentials
from google.auth.transport.requests import Request

# إعداد المعلومات الخاصة بـ OAuth
creds = Credentials(
    token=None,
    refresh_token=os.getenv('DRIVE_REFRESH_TOKEN'),
    client_id=os.getenv('DRIVE_CLIENT_ID'),
    client_secret=os.getenv('DRIVE_CLIENT_SECRET'),
    token_uri='https://oauth2.googleapis.com/token'
)

# تخزين التوكن بعد التوثيق
creds.refresh(Request())
os.environ['YOUTUBE_REFRESH_TOKEN'] = creds.token
        "
      env:
        DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
        DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
        DRIVE
