name: Upload Video to YouTube

on:
  push:
    branches:
      - main  # أو أي فرع آخر ترغب في مراقبته
  workflow_dispatch:  # لتشغيل الـ workflow يدويًا إذا أردت

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Upload video to YouTube
      run: |
        python upload_video.py
        echo "Upload Video to YouTube - Success" >> log.txt  # تسجيل نجاح الرفع في السجل
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    - name: Commit and push log changes
      run: |
        git config --global user.name "GitHub Actions"  # إعداد اسم المستخدم
        git config --global user.email "actions@github.com"  # إعداد البريد الإلكتروني
        git add log.txt  # إضافة ملف السجل إلى Git
        git commit -m "Update log with video upload status"  # إضافة التغيير (commit)
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git  # رفع التغييرات باستخدام التوكن
