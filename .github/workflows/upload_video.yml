name: Quran Video Upload 🎥

on:
  schedule:
    - cron: "0 * * * *"   # كل ساعة عند الدقيقة 0 UTC
  workflow_dispatch:       # لتشغيل workflow يدويًا عند الحاجة

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    name: Upload Quran Videos to YouTube

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 tqdm packaging

      - name: 🚀 Run Upload Script
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_video.py
