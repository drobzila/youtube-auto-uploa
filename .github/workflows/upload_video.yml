name: Auto YouTube Upload

on:
  schedule:
    - cron: "0 7,11,15,19,21 * * *"
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install requirements
        run: pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Write credentials.json
        run: echo "${{ secrets.GOOGLE_CREDENTIALS }}" > credentials.json

      - name: Run script
        run: python upload_video.py

      - name: Commit updated uploaded.json
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add uploaded.json
          git commit -m "update uploaded.json" || echo "No changes"
          git push
