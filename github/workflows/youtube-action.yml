name: YouTube Shorts Fetcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  youtube:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run the script
      env:
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}  # استخدم الـ Secret المخزن
      run: |
        python upload_video.py
